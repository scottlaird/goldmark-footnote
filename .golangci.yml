version: "2"
linters:
  default: none
  enable:
    - errcheck
    - godot
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - SA*
        - S1*
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
          severity: warning
          disabled: false
        - name: context-as-argument
          severity: warning
          disabled: false
        - name: context-keys-type
          severity: warning
          disabled: false
        - name: dot-imports
          severity: warning
          disabled: true
        - name: error-return
          severity: warning
          disabled: false
        - name: error-strings
          severity: warning
          disabled: false
        - name: error-naming
          severity: warning
          disabled: false
        - name: exported
          severity: warning
          disabled: false
        - name: increment-decrement
          severity: warning
          disabled: false
        - name: var-naming
          severity: warning
          disabled: false
        - name: var-declaration
          severity: warning
          disabled: false
        - name: package-comments
          severity: warning
          disabled: false
        - name: range
          severity: warning
          disabled: false
        - name: receiver-naming
          severity: warning
          disabled: false
        - name: time-naming
          severity: warning
          disabled: false
        - name: unexported-return
          severity: warning
          disabled: false
        - name: indent-error-flow
          severity: warning
          disabled: false
        - name: errorf
          severity: warning
          disabled: false
        - name: empty-block
          severity: warning
          disabled: true
        - name: superfluous-else
          severity: warning
          disabled: false
        - name: unused-parameter
          severity: warning
          disabled: true
        - name: unreachable-code
          severity: warning
          disabled: false
        - name: redefines-builtin-id
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - lll
        path: _test.go
      # footnote.go keeps goldmark's exported names on purpose, so that moving
      # from extension.Footnote is a change of import path and nothing else and
      # so that a future goldmark release can be merged into it. They stutter in
      # this package, and renaming them would cost more than it is worth.
      - linters:
          - revive
        path: footnote.go
        text: stutters
formatters:
  enable:
    - gofmt
